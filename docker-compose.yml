version: "3.8"

services:
    app:
        build: .
        container_name: vite-fullstack
        ports:
            - "3000:3000" # Frontend
            - "6000:6000" # Backend
        volumes:
            - ./src:/app/src
            - ./public:/app/public
            - ./server:/app/server
        environment:
            - NODE_ENV=development
        restart: unless-stopped
